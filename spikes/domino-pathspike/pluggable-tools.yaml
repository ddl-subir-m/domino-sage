# Pluggable Workspace Tool definition for the Path-A spike.
#
# SCHEMA NOTE: each tool is a TOP-LEVEL key (no `tools:` wrapper). Domino reads a top-level
# `tools:` as a single tool named "tools" and then reports `/tools/start: error.path.missing`.
# If in doubt, open a standard environment's JupyterLab block and match its shape exactly.
#
# Load-bearing choices for Path A:
#   - httpProxy.port         : the port our FastAPI proxy binds (run.sh PORT, default 8888)
#   - httpProxy.rewrite:false: tells Domino NOT to rewrite/strip the path, so the proxy
#                              prefix is PRESERVED end-to-end (server.py + Vite assume this)
#   - httpProxy.internalPath : the templated public path -> this is the SAGE_BASE_PREFIX we
#                              feed Vite/uvicorn (STEP 2 confirms how it renders in-container)

sageSpike:
  title: "Sage Path Spike"
  iconUrl: "/assets/images/workspace-logos/jupyterlab.svg"
  # Invoke via `bash <path>` (exec bit / shebang irrelevant); run.sh derives SAGE_BASE_PREFIX
  # from Domino env. Confirmed working path: /mnt/code is the project mount (DOMINO_WORKING_DIR).
  start:
    - "bash"
    - "/mnt/code/spikes/domino-pathspike/run.sh"
  httpProxy:
    port: 8888
    rewrite: false
    requireSubdomain: false
    internalPath: "/{{ownerUsername}}/{{projectName}}/{{sessionPathComponent}}/{{runId}}/"
