<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sage Workspace</title>
  <style>
    /* Inter from Sage's own origin (#19). Do not <link> Google fonts. */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('fonts/inter-latin-var.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
        U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
        U+FEFF, U+FFFD;
    }
  </style>
  <link rel="stylesheet" href="./vendor/reset.css" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/shell.css" />
  <link rel="stylesheet" href="./css/chat.css" />
  <link rel="stylesheet" href="./css/builder.css" />
  <link rel="stylesheet" href="./css/manage.css" />
  <link rel="stylesheet" href="./css/gallery.css" />
  <link rel="stylesheet" href="./css/code.css" />
</head>
<body>
  <div id="root"></div>

  <script>
    window.addEventListener('error', function (event) {
      var root = document.getElementById('root');
      if (!root || root.childElementCount) return;
      setTimeout(function () {
        if (root.childElementCount) return;
        root.innerHTML =
          '<div class="sw-boot-error"><h1>The workspace failed to start</h1><pre></pre>' +
          '<p>Check the browser console for the full stack.</p></div>';
        root.querySelector('pre').textContent =
          (event.message || 'Unknown error') + '\n' + (event.filename || '') + ':' + (event.lineno || 0);
      }, 0);
    });
  </script>

  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/icons.umd.min.js"></script>
  <script src="./vendor/highcharts.js"></script>
  <script src="./vendor/highcharts-more.js"></script>
  <script src="./vendor/highcharts-funnel.js"></script>

  <script src="./js/theme.js"></script>
  <script src="./js/util.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/router.js"></script>

  <script src="./js/components/charts.js"></script>
  <script src="./js/components/scope-picker.js"></script>
  <script src="./js/components/resource-tree.js"></script>
  <script src="./js/components/resource-panel.js"></script>
  <script src="./js/components/resource-catalog.js"></script>
  <script src="./js/components/resource-drawer.js"></script>
  <script src="./js/components/choice-card.js"></script>
  <script src="./js/components/conversation-list.js"></script>
  <script src="./js/components/app-list.js"></script>
  <script src="./js/components/composer.js"></script>
  <script src="./js/components/message-blocks.js"></script>
  <script src="./js/components/plan.js"></script>
  <script src="./js/components/handoff.js"></script>
  <script src="./js/components/collab.js"></script>
  <script src="./js/components/command-palette.js"></script>
  <script src="./js/components/shell.js"></script>

  <script src="./js/modes/chat.js"></script>
  <script src="./js/modes/builder.js"></script>
  <script src="./js/modes/code.js"></script>
  <script src="./js/modes/manage.js"></script>
  <script src="./js/modes/gallery.js"></script>

  <script src="./js/app.js"></script>
</body>
</html>
