<!-- "Google Bloom" - the codename wordmark for the google-cloud theme.
     GENERATED, and reproducible. "Google" is lifted verbatim from Google's own console
     wordmark: the 9 glyph subpaths left of the word gap at x=600. "Cloud" is dropped and
     "Bloom" is set in Inter - the face this app already ships - converted to outlines, so the
     mark needs no font at render time. An <img> cannot see the page's fonts anyway, which is
     why live <text> was not an option.
     Nothing here was eyeballed: Inter wght=518 matches the stem width of Google's own "l"
     (19.5 units); cap height 128 and baseline y=150.0 are Google's; and "Bloom" is
     positioned so its INK starts at x=611.4, exactly where "Cloud" used to, so the word space
     is Google's own rather than the B's sidebearing.
     TRADEMARK: contains Google's wordmark. Not ours, not covered by this repo's licence. -->
