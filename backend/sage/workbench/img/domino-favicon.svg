  <title>Domino</title>
  <!-- The mark from img/domino-logo.svg, cropped off the wordmark, which is an illegible sliver at
       16px. Its paths are `fill="white"` because the logo sits on a dark header, so a favicon with
       no ground would disappear into a light browser tab; the ground is the default pack's own
       `colors.primary`, not a new value. The mark fills 70% rather than the usual 60% because it is
       eight thin separated strokes, and at 60% they blur into each other at 16px.

       Partners never see this file. An unset `faviconUrl` falls back here; a set one is served from
       BRAND_DIR instead. Regenerate by cropping the logo, do not redraw. -->
