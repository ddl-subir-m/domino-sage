<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI Workbench">
  <title>AI Workbench</title>
  <!-- Tool-launcher icon for the Domino pluggable-tools `iconUrl`. It draws the Workbench's own
       shape: a frame split into a narrow chat column and a wide preview pane, with the agent's
       spark in the pane. Not the Domino mark - a partner replaces this file the way they replace
       `logoUrl` and `faviconUrl` (ADR-0014), so it must not carry Domino's identity.

       No ground. The IDE picker paints these on a light card, and its other marks (VSCode, Jupyter)
       are transparent while RStudio and JupyterLab are circles. A filled badge full-bleeds the box
       and reads bigger and heavier than every icon beside it. Everything is `colors.primary` on
       transparent instead. The trade is that this mark is invisible on a dark bar - if it is ever
       needed there, ship a second file, do not put the badge back here.

       Content is 81% of the width and 62% of the height, so the landscape frame carries less mass
       than a square neighbour at the same width. Strokes are 5 and 4 on a 64 grid; thinner strokes
       or a third element in either pane blur together at 20px. Export the PNG from this file. -->
  <g stroke="#543FDE" fill="none" stroke-width="5" stroke-linejoin="round">
    <rect x="8.5" y="14.5" width="47" height="35" rx="8"/>
    <path d="M24 14.5V49.5"/>
  </g>
  <g stroke="#543FDE" stroke-width="4" stroke-linecap="round">
    <path d="M13.5 27H19"/>
    <path d="M13.5 37H19"/>
  </g>
  <path d="M39.75 20.5C39.75 27.975 35.725 32 28.25 32C35.725 32 39.75 36.025 39.75 43.5C39.75 36.025 43.775 32 51.25 32C43.775 32 39.75 27.975 39.75 20.5Z" fill="#543FDE"/>
</svg>
