<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sage · Your apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #543FDE; --primary-hover: #3B23D1;
      --text: #1D1D24; --muted: #65657B; --faint: #9797AB;
      --border: #E7E7EE; --border-strong: #D8D8E2;
      --bg: #F7F7FB; --surface: #FFFFFF; --surface-2: #F2F2F7;
      --ok: #1F9D57; --err: #C20A29;
      --shadow: 0 1px 2px rgba(20,20,40,.04), 0 8px 24px rgba(20,20,40,.06);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #ECECF2; --muted: #A6A6BC; --faint: #74748A;
        --border: #2A2A36; --border-strong: #383848;
        --bg: #131318; --surface: #1B1B22; --surface-2: #22222B;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--text);
      background: var(--bg); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; }

    header { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 24px;
      border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--primary), #8B6BFF); color: #fff; font-weight: 800; }
    .brand { font-weight: 700; }
    .mode-chip { margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 3px 9px;
      border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
      display: flex; align-items: center; gap: 6px; }
    .mode-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .mode-chip.domino .dot { background: var(--ok); }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
    .page-head h1 { font-size: 26px; margin: 0 0 4px; }
    .page-head p { margin: 0; color: var(--muted); font-size: 13px; }

    .btn-primary { background: var(--primary); color: #fff; border: none; border-radius: 8px;
      padding: 9px 16px; font-weight: 600; font-size: 14px; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .55; cursor: default; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
      border-radius: 8px; padding: 8px 14px; font-weight: 600; }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-height: 128px; }
    .card h3 { margin: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .repo { font-size: 12px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .card .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
    .card .status.running .dot { background: var(--ok); }
    .card .actions { margin-top: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-ghost { background: transparent; border: none; color: var(--muted); font-weight: 600;
      padding: 8px 10px; border-radius: 8px; font-size: 14px; }
    .btn-ghost:hover { color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); }
    .btn-ghost:disabled { opacity: .55; cursor: default; }

    .btn-danger { background: transparent; border: none; color: var(--err); font-weight: 600;
      padding: 8px 10px; border-radius: 8px; font-size: 14px; }
    .btn-danger:hover { background: color-mix(in srgb, var(--err) 10%, transparent); }
    .btn-danger:disabled { opacity: .55; cursor: default; }

    .empty { text-align: center; color: var(--muted); padding: 64px 20px; border: 1px dashed var(--border-strong);
      border-radius: var(--radius); background: var(--surface); }
    .empty h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
    .empty p { margin: 0 0 18px; font-size: 13px; }

    .skeleton { height: 128px; border-radius: var(--radius); background: var(--surface-2);
      animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    .banner { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; display: none; }
    .banner.err { display: block; background: color-mix(in srgb, var(--err) 10%, var(--surface)); color: var(--err);
      border: 1px solid color-mix(in srgb, var(--err) 30%, var(--border)); }
    .banner.ok { display: block; background: color-mix(in srgb, var(--ok) 12%, var(--surface)); color: var(--ok);
      border: 1px solid color-mix(in srgb, var(--ok) 30%, var(--border)); }
    .banner a { color: inherit; font-weight: 700; }
    .banner .gb-item { margin-top: 6px; line-height: 1.5; }

    /* modal */
    .backdrop { position: fixed; inset: 0; background: rgba(15,15,30,.45); display: none; align-items: center;
      justify-content: center; padding: 20px; }
    .backdrop.open { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
      width: 100%; max-width: 440px; padding: 24px; }
    .modal h2 { margin: 0 0 4px; font-size: 18px; }
    .modal .hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .modal label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    .modal input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 14px; }
    .modal input:focus { outline: none; border-color: var(--primary); }
    .modal .slug { font-size: 12px; color: var(--faint); margin-top: 6px; min-height: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .modal .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .creating { display: none; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 12px 0 4px; }
    .creating.on { display: flex; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--surface-2); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .creating .steps { font-size: 12.5px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">S</div>
    <div class="brand">Sage</div>
    <div class="mode-chip" id="modeChip"><span class="dot"></span><span id="modeLabel">…</span></div>
  </header>

  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>Your apps</h1>
        <p>Each app is its own private repo and Domino project. Describe it, and Sage builds it.</p>
      </div>
      <button class="btn-primary" id="newBtn" onclick="openModal()">Create app</button>
    </div>

    <div class="banner" id="banner"></div>
    <div id="content"></div>
  </div>

  <div class="backdrop" id="backdrop">
    <div class="modal">
      <div id="modalForm">
        <h2>Create app</h2>
        <p class="hint">We'll create a private repo and a git-based project, then open the builder.</p>
        <label for="nameInput">App name</label>
        <input id="nameInput" placeholder="e.g. Sales dashboard" autocomplete="off"
          oninput="onName()" onkeydown="if(event.key==='Enter')submitCreate()" />
        <div class="slug" id="slugPreview"></div>
        <div class="row">
          <button class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" id="createBtn" onclick="submitCreate()" disabled>Create app</button>
        </div>
      </div>
      <div class="creating" id="creating">
        <div class="spinner"></div>
        <div><strong id="creatingName">Creating your app…</strong></div>
        <div class="steps" id="creatingStep">Provisioning the repo</div>
      </div>
    </div>
  </div>

  <script>
    // Relative base so calls work under Domino's proxy prefix AND as a published App.
    const BASE = new URL('.', location.href).pathname.replace(/\/$/, '');
    const api = (p) => `${BASE}${p}`;

    const $ = (id) => document.getElementById(id);
    const banner = (msg) => { const b = $('banner'); if (!msg) { b.className = 'banner'; b.textContent = ''; return; }
      b.className = 'banner err'; b.textContent = msg; };
    // Sage refused to publish because of what the app reads (#12). Every problem at once, each
    // naming the Data Source it is about — the banner stays until the next action, which is what a
    // refusal needs and a toast would not give.
    function refusal(problems) {
      const b = $('banner');
      b.className = 'banner err';
      b.innerHTML = '<strong>Sage didn’t publish this app</strong>'
        + problems.map(p => `<div class="gb-item">${esc(p.message)}</div>`).join('');
    }
    // Success notice, optionally with one or more pre-built link elements (HTML strings).
    function info(msg, links) {
      const b = $('banner');
      b.className = 'banner ok';
      const tail = (links && links.length) ? ' &nbsp; ' + links.join(' &nbsp;·&nbsp; ') : '';
      b.innerHTML = esc(msg) + tail;
    }

    function slugify(name) {
      const s = (name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return 'sage-' + (s || 'app');
    }
    function onName() {
      const v = $('nameInput').value;
      $('slugPreview').textContent = v.trim() ? `repo: ${slugify(v)}` : '';
      $('createBtn').disabled = !v.trim();
    }
    function openModal() { $('backdrop').classList.add('open'); $('modalForm').style.display = 'block';
      $('creating').classList.remove('on'); $('nameInput').value = ''; onName(); setTimeout(() => $('nameInput').focus(), 30); }
    function closeModal() { $('backdrop').classList.remove('open'); }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    $('backdrop').addEventListener('click', (e) => { if (e.target === $('backdrop')) closeModal(); });

    const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

    // Parse a response as JSON, tolerating a non-JSON body — a request that times out at Domino's app
    // proxy comes back as an HTML error page, and `await r.json()` on that throws "Unexpected token
    // '<'". Fall back to a readable error object instead.
    async function parseJson(r) {
      try { return await r.json(); }
      catch { return { error: `Request failed (${r.status})` }; }
    }

    // A running workspace's builder lives on the MAIN Domino host. When the hub is published as a
    // Domino App it's served from apps.<host>, so the host-relative open URL would resolve against
    // the apps origin and 404. Rewrite it to an absolute URL on the main host (drop the leading
    // "apps."). As a plain workspace tool the host has no "apps." prefix, so this is a no-op.
    function builderUrl(openUrl) {
      if (!openUrl || /^https?:\/\//i.test(openUrl)) return openUrl;
      const host = location.hostname;
      if (host.startsWith('apps.')) return `${location.protocol}//${host.slice(5)}${openUrl}`;
      return openUrl;
    }

    // A launched workspace reports state=Started before its session is running; opening the builder
    // then lands on a not-ready page. Poll status until the session is running, then return the URL.
    // onTick lets the caller surface progress. Gives up after ~4 min (80 × 3s).
    async function waitUntilRunning(projectId, wsId, onTick) {
      for (let i = 0; i < 80; i++) {
        try {
          const q = wsId ? `?workspace_id=${encodeURIComponent(wsId)}` : '';
          const r = await fetch(api(`/api/apps/${projectId}/status${q}`));
          if (r.ok) {
            const s = await r.json();
            if (s.running && s.open_url) return s.open_url;
          }
        } catch { /* transient — keep polling */ }
        if (onTick) onTick(i);
        await sleep(3000);
      }
      return null;
    }

    async function submitCreate() {
      const name = $('nameInput').value.trim();
      if (!name) return;
      banner(null);
      $('modalForm').style.display = 'none';
      $('creating').classList.add('on');
      $('creatingName').textContent = `Creating “${name}”…`;
      $('creatingStep').textContent = 'Provisioning the repo and project (this can take a minute)';
      try {
        const r = await fetch(api('/api/apps'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }) });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
        let url = (data.running && data.open_url) ? data.open_url : null;
        if (!url) {
          $('creatingStep').textContent = 'Starting the builder — opens when it’s ready…';
          url = await waitUntilRunning(data.id, data.workspace_id);
        }
        closeModal();
        if (url) window.open(builderUrl(url), '_blank');
        else banner('Your app was created. It’s still starting — use Open builder in a moment.');
        await load();
      } catch (e) {
        closeModal();
        banner(e.message || 'Couldn’t create the app.');
      }
    }

    // Start (resume) the builder's workspace WITHOUT opening a browser tab — the Start/Stop toggle.
    // Reuses the same open endpoint (which resumes a stopped workspace or launches one); we just
    // don't navigate. The card polls to running.
    async function startApp(id, btn) {
      banner(null);
      const label = btn.textContent; btn.disabled = true; btn.textContent = 'Starting…';
      try {
        const r = await fetch(api(`/api/apps/${id}/open`), { method: 'POST' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
        await pollStatus(id, true);
      } catch (e) {
        banner(e.message || 'Couldn’t start the builder.');
        btn.disabled = false; btn.textContent = label;
      }
    }

    // Delete an app: archives its Domino project (soft — recoverable by an admin) and stops its
    // builder. The GitHub repo is intentionally kept.
    async function deleteApp(id, btn) {
      const name = APP_NAMES[id] || 'this app';
      if (!confirm(`Delete “${name}”?\n\nThis deletes any published Domino App, archives the Domino project, and stops its builder. The GitHub repo is kept, and a Domino admin can restore the project.`)) return;
      banner(null);
      // Disable the whole card while the (background) delete runs, and reflect progress in its status.
      const card = btn.closest('.card');
      const actions = card ? Array.from(card.querySelectorAll('button')) : [btn];
      const labels = actions.map(b => b.textContent);
      actions.forEach(b => b.disabled = true);
      btn.textContent = 'Deleting…';
      const statusEl = $(`status-${id}`);
      if (statusEl) { statusEl.className = 'status'; statusEl.innerHTML = '<span class="dot"></span><span>Deleting…</span>'; }
      try {
        const r = await fetch(api(`/api/apps/${id}`), { method: 'DELETE' });
        const data = await parseJson(r);
        if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
        await pollDelete(id);  // delete runs in the background; poll until the app is gone or it fails
      } catch (e) {
        banner(e.message || 'Couldn’t delete the app.');
        actions.forEach((b, i) => { b.disabled = false; b.textContent = labels[i]; });
      }
    }

    // The server deletes in the background (stop → delete Apps → delete workspaces → archive can take
    // ~75s). Poll delete-status until the project is gone ("done") or the server reports "failed".
    // Caps at ~2.5 min so it never polls forever; on timeout it just refreshes to reflect reality.
    async function pollDelete(id, tries = 50, every = 3000) {
      const name = APP_NAMES[id] || 'this app';
      for (let i = 0; i < tries; i++) {
        try {
          const r = await fetch(api(`/api/apps/${id}/delete-status`));
          if (r.ok) {
            const d = await parseJson(r);
            if (d.phase === 'done') { await load(); return; }
            if (d.phase === 'failed') {
              banner(`Couldn’t delete “${name}”: ${d.error || 'unknown error'}`);
              await load();
              return;
            }
          }
        } catch { /* transient — keep polling */ }
        await sleep(every);
      }
      await load();
    }

    // A published Domino App URL is usually absolute; if it comes back host-relative, resolve it
    // against the main host the same way the builder URL is (see builderUrl).
    function publishedUrl(u) {
      if (!u) return u;
      if (/^https?:\/\//i.test(u)) return u;
      return builderUrl(u);
    }

    // Publish the app's committed code as a live, shareable Domino App. Independent of the builder —
    // it deploys the latest commit on the branch (the builder autosaves after each build and on stop).
    async function publishApp(id, btn) {
      const name = APP_NAMES[id] || 'this app';
      if (!confirm(`Publish “${name}” as a live Domino App?\n\nThis deploys the latest saved (committed) code as a shareable Domino App. If you've just made changes, run a build or stop the builder first so they're saved.`)) return;
      banner(null);
      const label = btn.textContent; btn.disabled = true; btn.textContent = 'Publishing…';
      try {
        const r = await fetch(api(`/api/apps/${id}/publish`), { method: 'POST' });
        const data = await r.json();
        if (!r.ok && data.refused) { refusal(data.refused); return; }
        if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
        const verb = data.republished ? 'Re-published' : 'Published';
        const link = (href, label) => `<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
        const links = [];
        if (data.url) links.push(link(publishedUrl(data.url), 'Open app ↗'));
        // manage_url is a host-relative path; builderUrl resolves it to the external host
        // (DOMINO_API_HOST is the internal cluster address, not browser-reachable).
        if (data.manage_url) links.push(link(builderUrl(data.manage_url), 'Manage settings in Domino ↗'));
        info(`${verb} “${name}” — deploying…`, links);
        if (data.app_id) pollPublish(data.app_id, name, links);
      } catch (e) {
        banner(e.message || 'Couldn’t publish the app.');
      } finally { btn.disabled = false; btn.textContent = label; }
    }

    // Poll a published app's deploy status until it goes live or fails (deploy = npm ci + build +
    // serve, several minutes). Updates the banner in place; caps at ~8 min so it never polls forever.
    function pollPublish(appId, name, links) {
      let tries = 0;
      const MAX = 96;  // 96 * 5s = 8 min
      const timer = setInterval(async () => {
        if (++tries > MAX) { clearInterval(timer); return; }
        try {
          const r = await fetch(api(`/api/apps/publish-status?app_id=${encodeURIComponent(appId)}`));
          if (!r.ok) return;  // transient — keep polling
          const d = await r.json();
          if (d.phase === 'running') {
            clearInterval(timer);
            info(`“${name}” is live.`, links);
          } else if (d.phase === 'failed') {
            clearInterval(timer);
            banner(`Publishing “${name}” failed (status: ${d.status || 'Failed'}). Check the app logs in Domino for details.`);
          }
          // pending -> keep polling
        } catch { /* network blip — keep polling */ }
      }, 5000);
    }

    async function openApp(id, btn) {
      banner(null);
      const label = btn.textContent; btn.disabled = true; btn.textContent = 'Starting…';
      try {
        const r = await fetch(api(`/api/apps/${id}/open`), { method: 'POST' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
        let url = (data.running && data.open_url) ? data.open_url : null;
        if (!url) url = await waitUntilRunning(id, data.workspace_id);
        if (url) window.open(builderUrl(url), '_blank');
        else banner('The app is still starting — try Open builder again in a moment.');
        pollStatus(id, true);
      } catch (e) {
        banner(e.message || 'Couldn’t open the app.');
      } finally { btn.textContent = label; btn.disabled = false; }
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

    let APP_NAMES = {};

    function renderApps(apps) {
      const c = $('content');
      APP_NAMES = {};
      apps.forEach(a => { APP_NAMES[a.id] = a.name; });
      if (!apps.length) {
        c.innerHTML = `<div class="empty"><h2>No apps yet</h2>
          <p>Create your first app — Sage sets up a private repo and a live builder.</p>
          <button class="btn-primary" onclick="openModal()">Create app</button></div>`;
        return;
      }
      c.innerHTML = `<div class="grid">${apps.map(a => `
        <div class="card">
          <h3 title="${esc(a.name)}">${esc(a.name)}</h3>
          <div class="repo" title="${esc(a.git_url || '')}">${esc(a.git_url ? a.git_url.replace(/^https?:\/\//, '') : 'git-based project')}</div>
          <div class="status" id="status-${esc(a.id)}"><span class="dot"></span><span>Checking…</span></div>
          <div class="actions" id="actions-${esc(a.id)}">
            <button class="btn-secondary" onclick="startApp('${esc(a.id)}', this)">Start</button>
            <button class="btn-secondary" onclick="openApp('${esc(a.id)}', this)">Open builder</button>
            <button class="btn-secondary" onclick="publishApp('${esc(a.id)}', this)">Publish</button>
            <button class="btn-danger" onclick="deleteApp('${esc(a.id)}', this)">Delete</button>
          </div>
        </div>`).join('')}</div>`;
      apps.forEach(a => refreshStatus(a.id));
    }

    // Show whether the app's builder is running, and offer Stop when it is. One status call per card
    // on load — fine for a handful of apps; the builder is idle-costly, so surfacing it matters.
    async function refreshStatus(id) {
      const statusEl = $(`status-${id}`), actionsEl = $(`actions-${id}`);
      if (!statusEl || !actionsEl) return;
      try {
        const r = await fetch(api(`/api/apps/${id}/status`));
        if (!r.ok) throw new Error();
        const s = await r.json();
        if (s.running) {
          statusEl.className = 'status running';
          statusEl.innerHTML = '<span class="dot"></span><span>Builder running</span>';
          const wsArg = s.workspace_id ? `'${esc(s.workspace_id)}'` : 'null';
          actionsEl.innerHTML =
            `<button class="btn-ghost" onclick="stopApp('${esc(id)}', ${wsArg}, this)">Stop</button>` +
            `<button class="btn-secondary" onclick="openApp('${esc(id)}', this)">Open builder</button>` +
            `<button class="btn-secondary" onclick="publishApp('${esc(id)}', this)">Publish</button>` +
            `<button class="btn-danger" onclick="deleteApp('${esc(id)}', this)">Delete</button>`;
        } else {
          statusEl.className = 'status';
          statusEl.innerHTML = '<span class="dot"></span><span>Idle — opens on demand</span>';
          actionsEl.innerHTML =
            `<button class="btn-secondary" onclick="startApp('${esc(id)}', this)">Start</button>` +
            `<button class="btn-secondary" onclick="openApp('${esc(id)}', this)">Open builder</button>` +
            `<button class="btn-secondary" onclick="publishApp('${esc(id)}', this)">Publish</button>` +
            `<button class="btn-danger" onclick="deleteApp('${esc(id)}', this)">Delete</button>`;
        }
        return !!s.running;
      } catch { statusEl.className = 'status'; statusEl.innerHTML = ''; return undefined; }
    }

    // Domino's stop/start are async, so a single read catches a transient state ("Stopping", or
    // "Started" before the session is running) and the card then freezes on it. Re-read the card
    // until it reaches the expected running-state (or times out), so it settles on reality.
    async function pollStatus(id, until, tries = 12, every = 3000) {
      for (let i = 0; i < tries; i++) {
        const running = await refreshStatus(id);
        if (until == null || running === until) return;
        await sleep(every);
      }
    }

    async function stopApp(id, wsId, btn) {
      if (!confirm('Stop this builder? Uncommitted changes in the workspace will be lost.')) return;
      banner(null);
      const label = btn.textContent; btn.disabled = true; btn.textContent = 'Stopping…';
      try {
        const r = await fetch(api(`/api/apps/${id}/stop`), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workspace_id: wsId }) });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
        // The stop is async on Domino's side — poll until the card reads not-running so it doesn't
        // freeze on the "Stopping" transient.
        await pollStatus(id, false);
      } catch (e) {
        banner(e.message || 'Couldn’t stop the builder.');
        btn.disabled = false; btn.textContent = label;
      }
    }

    async function load() {
      $('content').innerHTML = `<div class="grid">${'<div class="skeleton"></div>'.repeat(3)}</div>`;
      try {
        const r = await fetch(api('/api/apps'));
        if (!r.ok) throw new Error(`Couldn’t load apps (${r.status})`);
        renderApps(await r.json());
      } catch (e) {
        $('content').innerHTML = '';
        banner(e.message);
      }
    }

    async function boot() {
      try {
        const h = await (await fetch(api('/healthz'))).json();
        $('modeLabel').textContent = h.mode === 'domino' ? 'Domino' : 'Local (fake)';
        $('modeChip').className = 'mode-chip' + (h.mode === 'domino' ? ' domino' : '');
      } catch { $('modeLabel').textContent = '—'; }
      await load();
    }
    boot();
  </script>
</body>
</html>
