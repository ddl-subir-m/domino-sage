[project]
name = "sage-backend"
version = "0.0.0"
description = "Domino AI App Builder (sage) — backend: enforcement shim, model router, agent driver"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "httpx>=0.27,<1.0",       # forwarding to the OpenAI-compatible gateway (Step 1.1)
    "python-dotenv>=1.0,<2.0",  # load backend/.env (gateway creds + model aliases)
    "websockets>=12,<16",       # proxy Vite HMR WebSocket into the preview (Step 3.3)
    "openpyxl>=3.1,<4.0",       # attachment descriptors: xlsx sheet names + dims (describe.py)
    "pypdf>=5.0,<7.0",          # attachment descriptors: pdf page count + text extraction
    "pillow>=10.0,<13.0",       # shrink oversized images to fit the prompt's inline budget
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sage"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
