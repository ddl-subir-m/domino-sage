[project]
name = "sage-backend"
version = "0.0.0"
description = "Domino AI App Builder (sage) — backend: enforcement shim, model router, agent driver"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "httpx>=0.27,<1.0",       # forwarding to the OpenAI-compatible gateway (Step 1.1)
    "python-dotenv>=1.0,<2.0",  # load backend/.env (gateway creds + model aliases)
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sage"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
