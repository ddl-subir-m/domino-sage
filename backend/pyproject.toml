[project]
name = "sage-backend"
version = "0.0.0"
description = "Domino AI App Builder (sage) — backend: enforcement shim, model router, agent driver"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "httpx>=0.27,<1.0",       # forwarding to the OpenAI-compatible gateway (Step 1.1)
    "python-dotenv>=1.0,<2.0",  # load backend/.env (gateway creds + model aliases)
    "websockets>=12,<16",       # proxy Vite HMR WebSocket into the preview (Step 3.3)
    "openpyxl>=3.1,<4.0",       # attachment descriptors: xlsx sheet names + dims (describe.py)
    "pypdf>=5.0,<7.0",          # attachment descriptors: pdf page count + text extraction
    "pillow>=10.0,<13.0",       # shrink oversized images to fit the prompt's inline budget
    "numpy>=2.0,<3.0",          # Chat sage-chat plots and array work (OpenCode bash uses this venv)
    "matplotlib>=3.8,<4.0",     # Chat charts: PNG under examples/<threadId>/
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-xdist>=3.6,<4.0", "ruff==0.16.1"]  # ruff pinned exactly — see [tool.ruff] required-version
# Reading INSIDE a Data Source (the #11 cascade): Arrow Flight over gRPC to datasource-proxy, which
# `domino_data` speaks and nothing else does. An EXTRA, not a dependency, on both counts:
#   - it pulls pandas and pyarrow, ~200MB installed, which no test and no laptop needs;
#   - the Sage image installs it explicitly (`uv sync --extra domino`), so the one place that does
#     need it says so out loud.
# The Domino base image already carries this package in its SYSTEM python — which is no help,
# because the orchestrator runs from uv's isolated venv and cannot see system site-packages. That
# gap is why the cascade answered "the Domino data library is not installed here" in a real builder
# while listing worked fine. See `DominoResourceProvider._introspect`.
domino = ["dominodatalab-data>=6.7,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sage"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# -n auto by default, because a bare `pytest` is what gets typed and serial is 6x slower: the full
# suite is 36s across cores against 218s on one, and even a single file is 3.8s against 9.4s. Use
# `-n0` to read interleaved output or to run one test under a debugger.
addopts = "-n auto"

[tool.ruff]
line-length = 110

# The rule set is pinned by pinning the tool. There is no `select` here, so the enabled rules are
# ruff's defaults — 413 of them under 0.16.1, and NOT a set of whole families: the defaults cherry-
# pick (2 of ~60 flake8-bandit rules, 1 of the flake8-implicit-str-concat rules, and so on). That
# makes `select = ["S", "ISC", ...]` a poor way to freeze this, because prefix selection is strictly
# WIDER than the default it is meant to reproduce — measured at +278 findings for the closest tuned
# set, and +2487 with the families listed as-is. Almost all of that delta is things this codebase
# does deliberately: function-local imports (PLC0415), shelling out to git/npx/lsof (S603/S607), the
# mid-file test imports (E402). Adopting them is a decision to make on purpose, not a side effect of
# wanting reproducibility.
#
# required-version gets the reproducibility without the decision: ruff REFUSES TO RUN against any
# other version, so an upgrade is a deliberate edit here rather than a silent change in what "clean"
# means. Bump it and the pin in [project.optional-dependencies].dev together, and expect to triage a
# diff in findings when you do.
required-version = "==0.16.1"

[tool.ruff.lint]
# Sage fails open on purpose: a broken descriptor, an unreadable settings file or a git call that
# didn't land must degrade the feature, never take down the turn that was using it. Those handlers
# are the design, not oversights, and each one already carries a comment saying what it protects.
# Stated once here rather than as ~20 per-site `noqa`s — the scattered version was already drifting
# out of date (ruff found 17 stale BLE001 directives on handlers where the rule no longer fires).
ignore = [
    "BLE001",  # blind `except Exception` — the fail-open handlers described above
    "S110",    # `try/except/pass` — same handlers, where there is genuinely nothing to log
]
