[project]
name = "sage-backend"
version = "0.0.0"
description = "Domino AI App Builder (sage) — backend: enforcement shim, model router, agent driver"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",       # forwarding to the OpenAI-compatible gateway (Step 1.1)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
