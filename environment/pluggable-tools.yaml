# Pluggable Workspace Tool for the shippable Sage Environment (Chat + Build).
#
# Same load-bearing choices proven in Phases 0–1:
#   - rewrite:false  -> Domino preserves the path prefix end-to-end (the orchestrator strips it)
#   - port 8888      -> the one port the orchestrator binds (SAGE_CONTROL_PORT in app.sh)
#   - internalPath   -> renders as /<owner>/<project>/notebookSession/<runId>/ (the derived prefix)
#
# start points at the baked entrypoint (/opt/sage/environment/app.sh), NOT a path on the project
# mount — the ship artifact carries its own code. Each tool is a TOP-LEVEL key (a `tools:` wrapper
# trips "/tools/start: error.path.missing").
#
# The key stays `sageBuilder` so existing Environments keep working. The same process is also the
# published Workbench App (this repo's root app.sh); that path uses SAGE_PROXY_MODE=app instead.

sageBuilder:
  title: "Sage"
  # Absolute URL, not a path: the tool nav loads this from the Domino UI, which has no mount
  # for our repo. Sourced from backend/sage/workbench/img/workbench-tool-icon.png; edit the
  # .svg beside it and re-export, do not redraw. An OEM points this at their own asset.
  iconUrl: "https://raw.githubusercontent.com/ddl-subir-m/domino-sage/main/backend/sage/workbench/img/workbench-tool-icon.png"
  start:
    - "bash"
    - "/opt/sage/environment/app.sh"
  httpProxy:
    port: 8888
    rewrite: false
    requireSubdomain: false
    internalPath: "/{{ownerUsername}}/{{projectName}}/{{sessionPathComponent}}/{{runId}}/"
